<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>タスクボード</title>
    <link rel="stylesheet" href="css/style.css" />

    <!-- React 本体と ReactDOM（CDN・バージョン固定） -->
    <script defer src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script defer src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <!-- JSX をブラウザ上で変換するための Babel -->
    <script defer src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
    <!-- アプリ本体（JSX）。file:// では読み込めないため Live Server などで開く -->
    <script type="text/babel" data-presets="react" src="js/app.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
  </body>
</html>
